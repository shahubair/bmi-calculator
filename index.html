<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator-container">
        <h1>BMI Calculator</h1>
        <div class="input-group">
            <label for="weight">Weight (kg)</label>
            <input type="number" id="weight" placeholder="Enter your weight in kilograms">
        </div>
        <div class="input-group">
            <label for="height">Height (cm)</label>
            <input type="number" id="height" placeholder="Enter your height in centimeters">
        </div>
        <button id="calculateBtn">Calculate BMI</button>
        <div class="result-container" id="result">
            <!-- BMI result will be displayed here -->
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
